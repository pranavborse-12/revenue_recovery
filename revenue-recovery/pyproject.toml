[project]
name = "Revflow"
version = "0.1.0"
description = "AI-powered revenue recovery platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "firebase-admin>=6.6.0",
    "groq>=1.7.0",
    "mistralai>=2.9.4",
    "openai>=1.68.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "razorpay>=1.4.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true